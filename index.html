    .rv{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}

    .rv-l{opacity:0;transform:translateX(-40px);transition:opacity .7s ease-out,transform .7s ease-out}
    .rv-l.v{opacity:1;transform:translateX(0)}
    .rv-r{opacity:0;transform:translateX(40px);transition:opacity .7s ease-out,transform .7s ease-out}
    .rv-r.v{opacity:1;transform:translateX(0)}
    .rv-s{opacity:0;transform:scale(.92);transition:opacity .6s ease-out,transform .6s ease-out}

    @keyframes pf{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

    @keyframes wi{from{opacity:0;transform:translateX(-50px) translateY(var(--wo,0px))}to{opacity:1;transform:translateX(0) translateY(0)}}
    .wi{opacity:0}
    .wi.iv{animation:wi .65s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--wd,0s)}
    @keyframes gf{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--fd,6px))}}
    .wi.fl{opacity:1;animation:gf var(--fdur,3s) ease-in-out infinite;animation-delay:var(--fdel,0s)}

    @keyframes fg{from{height:0}to{height:100%}}
    .fl{width:2px;background:linear-gradient(180deg,#1DC0AA,#06968A);animation:fg .6s ease-out forwards;animation-delay:var(--fld,0s);height:0}
    @keyframes ni{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
    .in{opacity:0}
    .in.iv{animation:ni .5s ease-out forwards;animation-delay:var(--nd,0s)}

    @keyframes fp{0%,100%{opacity:.4}50%{opacity:1}}
    .fa{animation:fp 2s ease-in-out infinite}

    .pc{transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s ease,border-color .4s ease}
    .pc:hover{transform:translateY(-6px);box-shadow:0 12px 40px rgba(29,192,170,.12);border-color:#13DDC2}
    .pc:hover .pi{transform:scale(1.03)}
    .pi{transition:transform .5s ease}

    .sc{transition:transform .35s ease,border-color .35s ease,background .35s ease}
    .sc:hover{transform:translateY(-4px);border-color:#13DDC2;background:rgba(29,192,170,.04)}

    .ns{background:rgba(8,8,8,.92)!important;backdrop-filter:blur(16px);border-bottom:1px solid rgba(29,192,170,.1)}
    .nl{position:relative}
    .nl::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:2px;background:#1DC0AA;transition:width .3s ease}
    .nl:hover::after,.nl.ac::after{width:100%}

    .mm{transform:translateX(100%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
    .mm.op{transform:translateX(0)}

    .fi{transition:border-color .3s ease,box-shadow .3s ease}
    .fi:focus{border-color:#13DDC2;box-shadow:0 0 0 3px rgba(29,192,170,.1)}

    .sw-d{display:block}.sw-m{display:none}
    @media(max-width:768px){.sw-d{display:none}.sw-m{display:block}}

    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:#080808}
    ::-webkit-scrollbar-thumb{background:#1C1C1C;border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:#2E2E2E}

    @media(prefers-reduced-motion:reduce){

      .in{opacity:1;animation:none!important}
      .pf{animation:none}
      .fa{animation:none}
      .fl{height:100%!important;animation:none!important}

    {t:'Litch Rentals',c:'Full-Stack Property Management Platform',d:'A full-stack rental management system designed to manage properties, units, tenants, payments, complaints, administrators, caretakers and landlords \u2014 with authentication, role-based dashboards and database-backed operations.',sk:['React','Tailwind CSS','Node.js','Express','MySQL','Prisma','REST API','Authentication','Linux','Nginx','PM2'],u:'https://litchrentals.duckdns.org',inf:'Deployed to a Linux VPS with frontend, backend API and database working together in a production environment.',fe:true,co:'#1DC0AA'},

    {t:'Delicious Treats',c:'Business Website \u00b7 Deployment & Maintenance',d:'A responsive business website showcasing products and services with a mobile-first experience, ongoing hosting, domain management, server configuration and maintenance.',sk:['Responsive Design','Frontend Development','Hosting','Domain','Server Configuration'],u:'https://delicioustreats.duckdns.org',inf:'Full deployment and ongoing production maintenance.',fe:false,co:'#D4A5E5'},
    {t:'WiFi Billing & Network Management',c:'Networking \u00b7 Automation \u00b7 Web Application',d:'A web-based WiFi billing system developed around network-user management and router integration, with testing in MikroTik environments. Manages authentication, billing and network users through a web interface.',sk:['Network Management','Router Integration','Authentication','Billing','Database','Web Interface','MikroTik'],u:'',inf:'Private repository. Technical demonstration available on request.',fe:false,co:'#F0C75E',pr:true,nt:'Tested in MikroTik-compatible environment. Functionality has not been validated for Safaricom routers and is not presented as compatible with them.'}

  /* ===== HOOKS ===== */
  function useIV(opts){
    var r=useRef(null),s=useState(false),vis=s[0],setV=s[1];
    useEffect(function(){
      var el=r.current; if(!el)return;
      var o=new IntersectionObserver(function(e){if(e[0].isIntersecting){setV(true);o.unobserve(el)}},{threshold:(opts&&opts.th)||0.1,rootMargin:(opts&&opts.rm)||'0px'});
      o.observe(el); return function(){o.disconnect()};
    },[]);
    return [ref,vis];
  }
  function useNav(){
    var a=useState(false),sc=a[0],setSc=a[1];
    var b=useState(''),ac=b[0],setAc=b[1];
    useEffect(function(){
      function fn(){
        setSc(window.scrollY>60);
        var cur='';
        for(var i=0;i<NAV.length;i++){var id=NAV[i].h.slice(1);var el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<=120)cur=id;}
        setAc(cur);
      }
      window.addEventListener('scroll',fn,{passive:true});fn();
      return function(){window.removeEventListener('scroll',fn)};
    },[]);
    return {sc:sc,ac:ac};
  }

  /* ===== SHARED HEADING ===== */
  function SH(props){
    var r=useIV(),ref=r[0],vis=r[1];

    if(props.su) inner.push(html`<p className="mt-4 text-gray-400 max-w-2xl mx-auto text-sm md:text-base leading-relaxed">${props.su}</p>`);
    return html`<div ref=${ref} className=${cls}>${inner}</div>`;
  }

    var mo=useState(false),mopen=mo[0],setMo=mo[1];

        </div>
      </nav>`;

            entries[i].target.classList.add('v');
            obs.unobserve(entries[i].target);

      requestAnimationFrame(function(){
        var els=document.querySelectorAll('.rv:not(.v),.rv-l:not(.v),.rv-r:not(.v),.rv-s:not(.v)');
        for(var i=0;i<els.length;i++) obs.observe(els[i]);

      return function(){obs.disconnect()};
