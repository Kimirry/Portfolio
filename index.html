    // ── Helpers ──
    function ss(obj) {
      var parts = [];
      for (var k in obj) {
        var v = obj[k];
        if (typeof v === 'number') v = v + 'px';
        parts.push(k.replace(/([A-Z])/g, '-$1').toLowerCase() + ':' + v);
      }
      return parts.join(';');
    }

    function useInView(opts) {
      var ref = useRef(null);
      var stateArr = useState(false);
      var visible = stateArr[0];
      var setVisible = stateArr[1];
      useEffect(function() {
        var el = ref.current;
        if (!el) return;
        var obs = new IntersectionObserver(function(entries) {
          if (entries[0].isIntersecting) { setVisible(true); obs.unobserve(el); }
        }, { threshold: (opts && opts.threshold) || 0.1, rootMargin: (opts && opts.rootMargin) || '0px' });
        obs.observe(el);
        return function() { obs.disconnect(); };
      }, []);
      return [ref, visible];
    }

    function useNavScroll() {
      var scrollArr = useState(false);
      var scrolled = scrollArr[0];
      var setScrolled = scrollArr[1];
      var activeArr = useState('');
      var active = activeArr[0];
      var setActive = activeArr[1];

      useEffect(function() {
        function onScroll() {
          setScrolled(window.scrollY > 60);
          var current = '';
          for (var i = 0; i < NAV_LINKS.length; i++) {
            var id = NAV_LINKS[i].href.slice(1);
            var el = document.getElementById(id);
            if (el && el.getBoundingClientRect().top <= 120) current = id;
          }
          setActive(current);
        }
        window.addEventListener('scroll', onScroll, { passive:true });
        onScroll();
        return function() { window.removeEventListener('scroll', onScroll); };
      }, []);
      return { scrolled:scrolled, active:active };
    }

    // ── SectionHeading ──
    function SectionHeading(props) {
      var refArr = useInView();
      var ref = refArr[0];
      var vis = refArr[1];
      var cls = 'text-center mb-16 reveal ' + (vis ? 'visible' : '');
      var titleCls = 'font-display font-extrabold leading-tight text-2xl md:text-3xl lg:text-4xl text-white';
      return html`
        <div ref=${ref} className=${cls}>
          ${props.eyebrow ? html`<p className="text-tl text-sm font-semibold tracking-widest uppercase mb-3">${props.eyebrow}</p>` : null}
          <h2 className=${titleCls}>${props.title}</h2>
          ${props.subtitle ? html`<p className="mt-4 text-gray-400 max-w-2xl mx-auto text-sm md:text-base leading-relaxed">${props.subtitle}</p>` : null}
        </div>
      `;
    }

    // ── Navbar ──
    function Navbar() {

      var menuArr = useState(false);
      var menuOpen = menuArr[0];
      var setMenuOpen = menuArr[1];

      function close() { setMenuOpen(false); }

      useEffect(function() {
        document.body.style.overflow = menuOpen ? 'hidden' : '';
        return function() { document.body.style.overflow = ''; };
      }, [menuOpen]);

      var navCls = 'fixed top-0 left-0 right-0 z-50 transition-all duration-300 ' + (nav.scrolled ? 'nav-scrolled py-3' : 'py-4');
      var desktopLinks = NAV_LINKS.map(function(l) {
        var linkCls = 'nav-link text-sm font-medium text-gray-300 hover:text-white transition-colors ' + (nav.active === l.href.slice(1) ? 'active text-white' : '');
        return html`<a key=${l.href} href=${l.href} className=${linkCls}>${l.label}</a>`;
      });

      var mobileLinks = NAV_LINKS.map(function(l) {
        return html`<a key=${l.href} href=${l.href} onClick=${close} className="text-2xl font-display font-semibold text-gray-200 hover:text-tl transition-colors">${l.label}</a>`;
      });

      return html`

                Let's Talk <i className="fas fa-arrow-right ml-1 text-xs"></i>
              </a>
            </div>
            <button className="lg:hidden text-white text-xl p-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-tl rounded"
                    onClick=${function(){ setMenuOpen(!menuOpen); }} aria-label="Toggle menu" aria-expanded=${menuOpen}>
              <i className=${'fas ' + (menuOpen ? 'fa-xmark' : 'fa-bars')}></i>
            </button>
          </div>
          <div className=${'mobile-menu fixed inset-0 top-0 bg-sf-900/98 backdrop-blur-xl z-40 flex flex-col items-center justify-center gap-8 lg:hidden ' + (menuOpen ? 'open' : '')}>
            ${mobileLinks}

              <div className="flex flex-wrap items-center justify-center lg:justify-start gap-4">

              <div>
                <h3 className="text-white font-display font-bold text-sm mb-4">Navigation</h3>
                <nav className="flex flex-col gap-2" aria-label="Footer navigation">${navLinks}</nav>
              </div>
              <div>
                <h3 className="text-white font-display font-bold text-sm mb-4">Connect</h3>
                <div className="flex gap-3">${socials}</div>
              </div>
            </div>
          </div>
          <div className="border-t border-white/5">
            <div className="max-w-6xl mx-auto px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
              <p className="text-gray-600 text-xs">&copy; 2025 Martin. All rights reserved.</p>
              <button onClick=${scrollToTop} className="text-tl text-xs font-medium hover:underline flex items-center gap-1 bg-transparent border-none cursor-pointer">
                Back to Top <i className="fas fa-arrow-up text-xs"></i>
              </button>
            </div>
          </div>
        </footer>
      `;
    }

    // ── App ──
    function App() {
      useEffect(function() {
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(e) {
            if (e.isIntersecting) {
              e.target.classList.add('visible');
              observer.unobserve(e.target);
            }
          });
        }, { threshold:0.08 });

        requestAnimationFrame(function() {
          var els = document.querySelectorAll('.reveal:not(.visible), .reveal-left:not(.visible), .reveal-right:not(.visible), .reveal-scale:not(.visible)');
          for (var i = 0; i < els.length; i++) observer.observe(els[i]);
        });

        return function() { observer.disconnect(); };
      }, []);

      return html`
        <${Navbar} />
        <main>
          <${Hero} />
          <${CredibilityStrip} />
          <${About} />
          <${TechStack} />
          <${Projects} />
          <${Infrastructure} />
          <${Services} />
          <${DevApproach} />
          <${WhyMe} />
          <${Contact} />
        </main>
        <${Footer} />
      `;
    }

    // ── Render ──
    var root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(html`<${App} />`);
  </script>

        gtag('config', 'G-E2MHNFZD3C');

</body>
