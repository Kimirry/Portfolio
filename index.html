    /* === 基础重置 === */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body { font-family:'DM Sans',sans-serif; background:#080808; color:#E8E8E8; overflow-x:hidden; -webkit-font-smoothing:antialiased; }

    .bg-grid {
      position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.025;

    /* === 滚动揭示动画 === */
    .reveal { opacity:0; transform:translateY(28px); transition:opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1); }
    .reveal.visible { opacity:1; transform:translateY(0); }
    .reveal-left { opacity:0; transform:translateX(-40px); transition:opacity 0.7s ease-out, transform 0.7s ease-out; }
    .reveal-left.visible { opacity:1; transform:translateX(0); }
    .reveal-right { opacity:0; transform:translateX(40px); transition:opacity 0.7s ease-out, transform 0.7s ease-out; }
    .reveal-right.visible { opacity:1; transform:translateX(0); }
    .reveal-scale { opacity:0; transform:scale(0.92); transition:opacity 0.6s ease-out, transform 0.6s ease-out; }
    .reveal-scale.visible { opacity:1; transform:scale(1); }

    /* === 头像浮动 === */
    @keyframes profileFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .profile-float { animation:profileFloat 5s ease-in-out infinite; }

    /* === 技能波浪动画 === */
    @keyframes waveIn {
      from { opacity:0; transform:translateX(-50px) translateY(var(--wo,0px)); }
      to   { opacity:1; transform:translateX(0) translateY(0); }
    }
    .wave-item { opacity:0; }
    .wave-item.in-view { animation:waveIn 0.65s cubic-bezier(0.22,1,0.36,1) forwards; animation-delay:var(--wd,0s); }
    @keyframes gentleFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(var(--fd,6px))} }
    .wave-item.floating { opacity:1; animation:gentleFloat var(--fdur,3s) ease-in-out infinite; animation-delay:var(--fdel,0s); }

    /* === 基础设施流程线 === */
    @keyframes flowGrow { from{height:0} to{height:100%} }
    .flow-line { width:2px; background:linear-gradient(180deg,#1DC0AA,#06968A); animation:flowGrow 0.6s ease-out forwards; animation-delay:var(--fld,0s); height:0; }
    @keyframes nodeIn { from{opacity:0;transform:scale(0.7)} to{opacity:1;transform:scale(1)} }
    .infra-node { opacity:0; }
    .infra-node.in-view { animation:nodeIn 0.5s ease-out forwards; animation-delay:var(--nd,0s); }

    /* === 流动箭头 === */
    @keyframes flowPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
    .flow-arrow { animation:flowPulse 2s ease-in-out infinite; }

    /* === 项目卡片悬停 === */
    .project-card { transition:transform 0.4s cubic-bezier(0.22,1,0.36,1), box-shadow 0.4s ease, border-color 0.4s ease; }

    .project-card:hover .project-img { transform:scale(1.03); }

    /* === 服务卡片 === */
    .service-card { transition:transform 0.35s ease, border-color 0.35s ease, background 0.35s ease; }
    .service-card:hover { transform:translateY(-4px); border-color:#13DDC2; background:rgba(29,192,170,0.04); }

    /* === 导航栏 === */
    .nav-scrolled { background:rgba(8,8,8,0.92)!important; backdrop-filter:blur(16px); border-bottom:1px solid rgba(29,192,170,0.1); }
    .nav-link { position:relative; }
    .nav-link::after { content:''; position:absolute; bottom:-2px; left:0; width:0; height:2px; background:#1DC0AA; transition:width 0.3s ease; }
    .nav-link:hover::after, .nav-link.active::after { width:100%; }

    .mobile-menu { transform:translateX(100%); transition:transform 0.4s cubic-bezier(0.22,1,0.36,1); }
    .mobile-menu.open { transform:translateX(0); }

    /* === 进程步骤连线 === */
    .process-connector { position:relative; }
    .process-connector::after { content:''; position:absolute; top:50%; right:-1.5rem; width:1.5rem; height:2px; background:linear-gradient(90deg,#1DC0AA,transparent); }

    /* === 表单焦点 === */
    .form-input { transition:border-color 0.3s ease, box-shadow 0.3s ease; }
    .form-input:focus { border-color:#13DDC2; box-shadow:0 0 0 3px rgba(29,192,170,0.1); }

    /* === 减弱动效偏好 === */
    @media (prefers-reduced-motion:reduce) {
      .reveal,.reveal-left,.reveal-right,.reveal-scale { opacity:1; transform:none; transition:none; }
      .wave-item { opacity:1; animation:none!important; }
      .infra-node { opacity:1; animation:none!important; }
      .profile-float { animation:none; }
      .flow-arrow { animation:none; }

    ::-webkit-scrollbar-thumb:hover { background:#2E2E2E; }

    // ========================================

    // 滚动进入视口检测
    function useInView(opts) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { setVisible(true); obs.unobserve(el); }
        }, { threshold:opts?.threshold || 0.1, rootMargin:opts?.rootMargin || '0px' });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return [ref, visible];
    }

    // 导航栏滚动状态 & 活跃区块
    function useNavScroll() {
      const [scrolled, setScrolled] = useState(false);
      const [active, setActive] = useState('');
      useEffect(() => {
        const onScroll = () => {
          setScrolled(window.scrollY > 60);
          const sections = NAV_LINKS.map(l => l.href.slice(1));
          let current = '';
          for (const id of sections) {
            const el = document.getElementById(id);
            if (el && el.getBoundingClientRect().top <= 120) current = id;
          }
          setActive(current);
        };
        window.addEventListener('scroll', onScroll, { passive:true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return { scrolled, active };
    }

    // ========================================
    // 通用组件
    // ========================================

            ${title}

          ${subtitle && html`<p className="mt-4 text-gray-400 max-w-2xl mx-auto text-sm md:text-base leading-relaxed">${subtitle}</p>`}
        </div>
      `;
    }

        setStatus('Sending message...');

            method:'POST',
            body: new FormData(formRef.current),
            headers: { 'Accept':'application/json' }

            setStatus('Message sent successfully.');
            formRef.current.reset();
          } else {

                    </a>
                  `)}
                </div>
              </div>
            </div>
          </div>
          <!-- 底栏 -->
          <div className="border-t border-white/5">
            <div className="max-w-6xl mx-auto px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
              <p className="text-gray-600 text-xs">&copy; 2025 Martin. All rights reserved.</p>
              <button onClick=${scrollToTop} className="text-tl text-xs font-medium hover:underline flex items-center gap-1 bg-transparent border-none cursor-pointer">
                Back to Top <i className="fas fa-arrow-up text-[10px]"></i>
              </button>
            </div>
          </div>
        </footer>
      `;
    }

    // ========================================
    // 主应用
    // ========================================
    function App() {
      // 全局滚动揭示初始化
      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('visible');
              observer.unobserve(e.target);
            }
          });
        }, { threshold:0.08 });

        // 延迟一帧以确保 DOM 已渲染
        requestAnimationFrame(() => {
          document.querySelectorAll('.reveal:not(.visible), .reveal-left:not(.visible), .reveal-right:not(.visible), .reveal-scale:not(.visible)').forEach(el => {
            observer.observe(el);
          });
        });

        return () => observer.disconnect();
      }, []);

      return html`
        <${Navbar} />
        <main>
          <${Hero} />
          <${CredibilityStrip} />
          <${About} />
          <${TechStack} />
          <${Projects} />
          <${Infrastructure} />
          <${Services} />
          <${DevApproach} />
          <${WhyMe} />
          <${Contact} />
        </main>
        <${Footer} />
      `;
    }

    // ========================================
    // 渲染
    // ========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(html`<${App} />`);
  </script>

      s.async = true;

        gtag('config', 'G-E2MHNFZD3C');

</body>
